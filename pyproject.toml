[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asmsa_v2"
version = "2.0.0a0"
description = "Analysis and Sampling of Molecular Simulations by adversarial Autoencoders (v2, PyTorch)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Guglielmo Tedeschi" },
]
dependencies = [
    "torch>=2.3",
    "numpy",
    "scipy",
    "matplotlib",
    "mdtraj",
    "networkx",
    "sympy",
    "tqdm",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asmsa_v2.featurize" = ["*.itp"]
