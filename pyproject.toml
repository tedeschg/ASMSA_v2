[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asmsa_v2"
version = "2.0.0"
description = "Analysis and Sampling of Molecular Simulations by adversarial Autoencoders (v2, PyTorch)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Guglielmo Tedeschi" },
]
dependencies = [
    "torch>=2.3",
    "numpy",
    "scipy",
    "matplotlib",
    "mdtraj",
    "networkx",
    "sympy",
    "tqdm",
    "pillow",
    "pyyaml",          # Project config (asmsa.yaml)
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "jupyterlab"]
# Hyperparameter tuning (03-tune); falls back to random search without optuna
tune = ["optuna", "pandas"]
# Clustering / pose analysis backends (07-analysis)
analysis = ["scikit-learn", "hdbscan", "pandas"]
# Interactive notebook visualization: hover plots + 3D structure linkage
viz = ["plotly", "py3Dmol", "ipywidgets", "anywidget"]
# Everything, for the full notebook pipeline
full = [
    "pytest", "ipykernel", "jupyterlab",
    "optuna", "pandas",
    "scikit-learn", "hdbscan",
    "plotly", "py3Dmol", "ipywidgets", "anywidget",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asmsa_v2.featurize" = ["*.itp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning:torch.jit",
]
